name: "CI: Change Validation"

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-suite:
    name: Unit tests and lint
    uses: ./.github/workflows/ci_unit-test-lint.yml

  required-status-checks:
    name: "Required Status Checks" # do not change, used in ruleset "Required Status Checks"
    if: ${{ always() }}
    needs:
      - test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$NEEDS"
