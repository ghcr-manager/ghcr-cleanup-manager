# Builds:
# - single: multi-arch manifest (tagged, with provenance, no cosign signature)
#   - single-amd64: image (tagged, with provenance, no cosign signature)
#   - single-arm64: image (tagged, with provenance and cosign signature)

name: "Test: Setup Package Single Attestation"

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PACKAGE: ${{ github.event.repository.name }}-test--single-attestation
  IMAGE_REF: ghcr.io/${{ vars.GH_TEST_ORG }}/${{ github.event.repository.name }}-test--single-attestation

jobs:
  prepare-environment:
    name: Verify environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require test org configuration
        shell: bash
        env:
          GH_TEST_ORG: ${{ vars.GH_TEST_ORG }}
          GH_TEST_PAT_USERNAME: ${{ vars.GH_TEST_PAT_USERNAME }}
          GH_TEST_PAT: ${{ secrets.GH_TEST_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TEST_ORG" ]] || { echo "Missing repo variable GH_TEST_ORG" >&2; exit 1; }
          [[ -n "$GH_TEST_PAT_USERNAME" ]] || { echo "Missing repo variable GH_TEST_PAT_USERNAME" >&2; exit 1; }
          [[ -n "$GH_TEST_PAT" ]] || { echo "Missing repo secret GH_TEST_PAT" >&2; exit 1; }

      - name: Clear scenario package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TEST_PAT }}
          OWNER: ${{ vars.GH_TEST_ORG }}
        run: |
          set -euo pipefail
          node tests/tools/delete-ghcr-package.mjs "$OWNER" "$PACKAGE" "$GITHUB_TOKEN"

  build_dummy_last_tag:
    name: Build dummy image (last tag must remain)
    runs-on: ubuntu-latest
    needs: prepare-environment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build keep-dummy image
        uses: ./.github/actions/test-registry-build-last-tag
        with:
          image_ref: ${{ env.IMAGE_REF }}
          registry_username: ${{ vars.GH_TEST_PAT_USERNAME }}
          registry_password: ${{ secrets.GH_TEST_PAT }}

  build_amd64:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - prepare-environment
      - build_dummy_last_tag
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test image
        id: build
        uses: ./.github/actions/test-registry-build-image
        with:
          image_ref: ${{ env.IMAGE_REF }}
          arch: amd64
          platform: linux/amd64
          registry_username: ${{ vars.GH_TEST_PAT_USERNAME }}
          registry_password: ${{ secrets.GH_TEST_PAT }}

  build_arm64:
    name: Build image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
    needs:
      - prepare-environment
      - build_dummy_last_tag
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test image
        id: build
        uses: ./.github/actions/test-registry-build-image
        with:
          image_ref: ${{ env.IMAGE_REF }}
          arch: arm64
          platform: linux/arm64
          registry_username: ${{ vars.GH_TEST_PAT_USERNAME }}
          registry_password: ${{ secrets.GH_TEST_PAT }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign arm64 image only
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF@$DIGEST"

  publish:
    name: Publish multi-arch image
    needs:
      - prepare-environment
      - build_dummy_last_tag
      - build_amd64
      - build_arm64
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GH_TEST_PAT_USERNAME }}
          password: ${{ secrets.GH_TEST_PAT }}

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      - name: Publish multi-arch image
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build_arm64.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          manifest_digest="$(
            docker buildx imagetools create \
              --dry-run \
              --annotation "index:org.opencontainers.image.source=$OCI_SOURCE" \
              --annotation "index:org.opencontainers.image.version=single" \
              "$IMAGE_REF@$AMD64_DIGEST" \
              "$IMAGE_REF@$ARM64_DIGEST" \
            | regctl manifest put \
                --by-digest \
                "$IMAGE_REF" \
                --format '{{ ( .Manifest.GetDescriptor ).Digest }}'
          )"

          regctl image copy "$IMAGE_REF@$manifest_digest" "$IMAGE_REF:single"
          regctl image copy \
            "$IMAGE_REF@$AMD64_DIGEST" \
            "$IMAGE_REF:single-amd64"
          regctl image copy \
            "$IMAGE_REF@$ARM64_DIGEST" \
            "$IMAGE_REF:single-arm64"

      - name: Print result
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          echo "Created package $IMAGE_REF"
