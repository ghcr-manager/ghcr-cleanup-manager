name: "Test: Scenario Executor Matrix"
run-name: "Test Scenario Executor Matrix (executors: ${{ inputs.executors }})"

"on":
  workflow_dispatch:
    inputs:
      executors:
        description: Which executor matrix rows to include in this run.
        required: true
        default: ghcr-cleanup-manager
        type: choice
        options:
          - all
          - ghcr-cleanup-manager
          - ghcr-cleanup-action
          - vlaurin-action-ghcr-prune
          - chizkiyahu-delete-untagged-ghcr-action
      upload_artifacts:
        description: Upload the final rescan DB artifact from inside the action.
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        description: Optional artifact retention-days override for action-owned DB uploads.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      executors:
        required: false
        default: ghcr-cleanup-manager
        type: string
      upload_artifacts:
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        required: false
        default: ""
        type: string
      db_file:
        required: false
        default: ghcr-cleanup-manager-merged--scenario-matrix-cleanup.sqlite
        type: string
    secrets:
      GH_TEST_PAT:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render scenario matrix
        id: matrix
        env:
          EXECUTORS: ${{ inputs.executors }}
        shell: bash
        run: |
          set -euo pipefail
          matrix_json="$(node tests/tools/render-test-scenario-matrix.mjs)"
          if [[ "$EXECUTORS" != "all" ]]; then
            matrix_json="$(jq -c --arg executor "$EXECUTORS" '.include |= map(select(.executor == $executor))' <<< "$matrix_json")"
          fi
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  execute:
    needs: prepare
    name: ${{ matrix.jobName }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/test_scenario-executor.yml
    permissions:
      actions: write
      contents: read
      id-token: write
    secrets:
      GH_TEST_PAT: ${{ secrets.GH_TEST_PAT }}
    with:
      scenario: ${{ matrix.scenario }}
      executor: ${{ matrix.executor }}
      upload_artifacts: ${{ inputs.upload_artifacts }}
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
      package_name_suffix: ${{ matrix.executor }}

  bundle-db-artifacts:
    if: ${{ always() && inputs.upload_artifacts }}
    needs: execute
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge current-run scenario DB artifacts
        id: merge
        uses: ./merge-run-artifacts
        with:
          upload-artifacts: "true"
          db-file: ${{ inputs.db_file || 'ghcr-cleanup-manager-merged--scenario-matrix-cleanup.sqlite' }}
          db-artifact-retention-days: ${{ inputs.artifact_retention_days }}
          delete-source-artifacts: "true"
          artifact-name-glob: "*.sqlite"

      - name: Print merged artifact outputs
        shell: bash
        env:
          MERGED_ARTIFACT_DIGEST: ${{ steps.merge.outputs.artifact-digest }}
          MERGED_ARTIFACT_ID: ${{ steps.merge.outputs.artifact-id }}
          MERGED_ARTIFACT_URL: ${{ steps.merge.outputs.artifact-url }}
          MERGED_DB_PATH: ${{ steps.merge.outputs.db-path }}
        run: |
          set -euo pipefail
          echo "db-path: $MERGED_DB_PATH"
          echo "artifact-id: $MERGED_ARTIFACT_ID"
          echo "artifact-url: $MERGED_ARTIFACT_URL"
          echo "artifact-digest: $MERGED_ARTIFACT_DIGEST"
