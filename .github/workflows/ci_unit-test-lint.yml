name: "CI: Unit-test, lint"

"on":
  workflow_call:
  workflow_dispatch:
    inputs:
      write-job-summary:
        description: "Controls job summary output"
        required: false
        default: "on-failure-only"
        type: choice
        options:
          - "on-failure-only"
          - "true"
permissions:
  contents: read

jobs:
  test-suite:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@9f5dad6bb6148bd29ff0d874de6a8cc70af08fa9 # v2.6.2
        with:
          include-first-party: "true"
          exclude-workflows: ".github/workflows/manual-run_scan.yml,test_scenario-executor.yml,test_scenario-executor-matrix.yml,test_scenario-graph-matrix.yml"
          write-job-summary: ${{ inputs.write-job-summary || 'on-failure-only' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Run tests
        run: |
          npm test

      - name: Run linters
        run: |
          scripts/lint.sh

      - name: Check links in markdown
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-verbose-mode: true
